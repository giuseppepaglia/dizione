<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dizione">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dizione</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1d1f24; --muted: #6b7079; --line: #e3e4e6;
    --blu: #2c5cbe; --arancio: #e8813a; --ok: #2f9e5b; --err: #d64545; --mezzo: #c99a16; --accento: #2c5cbe;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1e2027; --ink: #eef0f3; --muted: #9aa0aa; --line: #2c2f37; --accento: #6f9bff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100vh; }
  h1 { font-size: 30px; margin: 8px 0 2px; letter-spacing: -0.5px; }
  h2 { font-size: 20px; margin: 22px 0 8px; }
  p { margin: 6px 0; }
  .sotto { color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 10px 0; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 13px 16px; cursor: pointer; }
  .btn { background: var(--accento); color: #fff; font-weight: 600; width: 100%; margin: 6px 0; }
  .btn.sec { background: transparent; color: var(--accento); border: 1.5px solid var(--accento); }
  .btn.peric { background: transparent; color: var(--err); border: 1.5px solid var(--err); }
  .riga { display: flex; gap: 8px; }
  .riga > * { flex: 1; }
  .voce { display: block; width: 100%; text-align: left; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 8px 0; }
  .voce b { display: block; font-size: 17px; }
  .voce span { color: var(--muted); font-size: 14px; }
  .stato { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .s-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .s-no { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
  .s-mezzo { background: color-mix(in srgb, var(--mezzo) 18%, transparent); color: var(--mezzo); }
  .indietro { background: none; color: var(--accento); padding: 6px 0; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  textarea, select, input[type=number] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; background: var(--card); color: var(--ink); }
  textarea { min-height: 140px; }
  /* sessione */
  .sess { display: flex; flex-direction: column; min-height: calc(100vh - 60px); }
  .sess-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 15px; }
  .parola { font-size: clamp(40px, 13vw, 76px); font-weight: 700; text-align: center; margin: 9vh 0 10px; word-break: break-word; letter-spacing: -0.5px; }
  .parola.frase { font-size: clamp(30px, 9vw, 50px); }
  .v-chiusa { color: var(--blu); }
  .v-aperta { color: var(--arancio); }
  .fase { text-align: center; font-size: 18px; color: var(--muted); min-height: 28px; }
  .fase.rec { color: var(--err); font-weight: 600; }
  .meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 10px 18% 0; }
  .meter > div { height: 100%; width: 0; background: var(--err); transition: width .08s; }
  .esito { text-align: center; margin: 18px 0 8px; min-height: 110px; }
  .esito .grande { font-size: 24px; font-weight: 700; }
  .barra { position: relative; height: 14px; border-radius: 99px; margin: 16px 8px 4px;
    background: linear-gradient(90deg, var(--blu), #9aa0aa 50%, var(--arancio)); }
  .barra .seg { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--card); opacity: .9; }
  .barra .punto { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--ink); }
  .etich { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 0 8px; }
  .comandi { margin-top: auto; }
  .nota { font-size: 14px; color: var(--muted); }
  .avviso { border-left: 4px solid var(--mezzo); }
  .errore { border-left: 4px solid var(--err); }
  a { color: var(--accento); }
</style>
</head>
<body>
<div id="app"></div>
<script src="dsp.js"></script>
<script>
'use strict';
const D = window.Dizione;

// ------------------------------------------------------------------ liste (uguali al server del PC)
const LISTE = {
  taratura: { titolo: 'Taratura', descrizione: 'Parole di controllo: qui italiano standard e abitudine sarda coincidono, quindi danno le tue vocali di riferimento.',
    analisi: 'taratura', accenti: true, secondi: 2.0,
    parole: ['vérdi','bèllo','róssi','pòsto','càsa','vìno','lùna','mési','tèmpo','nómi','pòrta','pàne','fìlo','mùro','fréddi','lètto','giórni','nuòvo','néri','fèrro','mólti','mòrte'] },
  diagnostico_metafonia: { titolo: 'Test: metafonia', descrizione: 'Parole in cui l’abitudine sarda (aperta davanti ad a/e/o, chiusa davanti a i/u) si scontra con lo standard. Accenti nascosti.',
    analisi: 'vocali', accenti: false, secondi: 2.0,
    parole: ['nóme','sóle','cóme','mése','séra','vérde','bócca','lavóro','óra','rósso','giórno','bèlli','nuòvi','tèmpi','pòsti','lètti'] },
  diagnostico_coppie: { titolo: 'Test: coppie di significato', descrizione: 'Pesca/pèsca, venti/vènti, botte/bòtte… dentro frasi che ne fissano il senso. Accenti nascosti.',
    analisi: 'vocali', accenti: false, secondi: 3.0,
    parole: ['vado a pésca','mangio una pèsca','vénti persone','i vènti forti','una bótte di vino','ha preso le bòtte','la légge','lui lègge','un fóro nel muro','l’avvocato del fòro','ho cólto la rosa','un uomo còlto'] },
  esercizio_e: { titolo: 'Esercizio: é / è', descrizione: 'Accenti visibili: blu = chiusa, arancio = aperta.',
    analisi: 'vocali', accenti: true, secondi: 2.0, ripeti: true,
    parole: ['séra','bèlla','mése','tèrra','vérde','fèsta','stélla','pèzzo','bèlli','tèmpi','lètti','pèzzi'] },
  esercizio_o: { titolo: 'Esercizio: ó / ò', descrizione: 'Accenti visibili: blu = chiusa, arancio = aperta.',
    analisi: 'vocali', accenti: true, secondi: 2.0, ripeti: true,
    parole: ['nóme','mòda','sóle','ròsa','cóme','còsa','bócca','fòrte','nuòvi','pòsti','mòrti','fuòchi'] },
  doppie: { titolo: 'Doppie e scempie', descrizione: 'Caro/carro, fato/fatto…: durata della consonante dopo la tonica.',
    analisi: 'durate', accenti: false, secondi: 2.0,
    parole: ['caro','carro','pala','palla','fato','fatto','nono','nonno','sete','sette','casa','cassa'] },
};

// ------------------------------------------------------------------ dati (sul telefono)
const CHIAVE = 'dizione.v1';
function carica() {
  try { const d = JSON.parse(localStorage.getItem(CHIAVE) || 'null'); if (d) return d; } catch (e) {}
  return { impostazioni: { voce: 'uomo', ripeti: true }, taratura: {}, storico: [], mie: '' };
}
let DATI = carica();
function salva() {
  try { localStorage.setItem(CHIAVE, JSON.stringify(DATI)); return true; }
  catch (e) { mostraAvviso('Non riesco a salvare sul telefono: esporta un backup dallo Storico.'); return false; }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
const taratura = () => new D.Taratura(DATI.taratura || {});
const profiloVoce = () => D.PROFILI_VOCE[DATI.impostazioni.voce] || D.PROFILI_VOCE.uomo;

// ------------------------------------------------------------------ utilità
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ora = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
let avvisoTimer;
function mostraAvviso(t) {
  let el = $('#avviso');
  if (!el) { el = document.createElement('div'); el.id = 'avviso';
    el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#333;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;font-size:15px';
    document.body.appendChild(el); }
  el.textContent = t; el.style.display = 'block';
  clearTimeout(avvisoTimer); avvisoTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
}
// colora la vocale accentata: blu chiusa, arancio aperta
function parolaHtml(testo, accenti) {
  if (!accenti) return esc(D.senzaAccenti(testo));
  return esc(testo).replace(/[éó]/g, (c) => `<span class="v-chiusa">${c}</span>`).replace(/[èò]/g, (c) => `<span class="v-aperta">${c}</span>`);
}

// ------------------------------------------------------------------ microfono
const MIC = { ctx: null, stream: null, proc: null, src: null, fs: 44100, ascolto: null, livello: 0, rumore: 0.002 };
async function apriMicrofono() {
  if (MIC.stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Questo browser non dà accesso al microfono.');
  // il contesto audio va creato subito, dentro il tocco dell'utente (regola di iOS)
  const AC = window.AudioContext || window.webkitAudioContext;
  MIC.ctx = new AC();
  const ripresa = MIC.ctx.resume();
  try {
    MIC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  } catch (e) { MIC.ctx.close().catch(() => {}); MIC.ctx = null; throw e; }
  await ripresa; await MIC.ctx.resume();
  MIC.fs = MIC.ctx.sampleRate;
  MIC.src = MIC.ctx.createMediaStreamSource(MIC.stream);
  MIC.proc = MIC.ctx.createScriptProcessor(4096, 1, 1);
  MIC.proc.onaudioprocess = (e) => {
    const d = e.inputBuffer.getChannelData(0);
    let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
    MIC.livello = Math.sqrt(s / d.length);
    const m = $('#meter'); if (m) m.style.width = Math.min(100, Math.max(0, (20 * Math.log10(MIC.livello + 1e-9) + 60) / 60 * 100)) + '%';
    if (MIC.ascolto) MIC.ascolto(d);
  };
  MIC.src.connect(MIC.proc);
  MIC.proc.connect(MIC.ctx.destination);
}
function chiudiMicrofono() {
  try { MIC.proc && MIC.proc.disconnect(); MIC.src && MIC.src.disconnect(); } catch (e) {}
  if (MIC.stream) MIC.stream.getTracks().forEach((t) => t.stop());
  if (MIC.ctx) MIC.ctx.close().catch(() => {});
  Object.assign(MIC, { ctx: null, stream: null, proc: null, src: null, ascolto: null });
}
function concatena(pezzi) {
  const n = pezzi.reduce((a, p) => a + p.length, 0), x = new Float32Array(n);
  let o = 0; for (const p of pezzi) { x.set(p, o); o += p.length; }
  return x;
}
async function misuraRumore(sec = 0.7) {
  const val = [];
  await new Promise((res) => {
    const t0 = performance.now();
    MIC.ascolto = (d) => { let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i]; val.push(Math.sqrt(s / d.length));
      if (performance.now() - t0 > sec * 1000) { MIC.ascolto = null; res(); } };
  });
  val.sort((a, b) => a - b);
  MIC.rumore = Math.max(val[Math.floor(val.length / 2)] || 0.001, 0.0005);
}
// registra una parola: si ferma 0,5 s dopo la fine del parlato (o al tempo massimo)
function registraParola(maxSec) {
  return new Promise((res) => {
    const pezzi = []; let parlato = false, silenzio = 0, n = 0;
    const soglia = Math.max(MIC.rumore * 4, 0.004);
    MIC.ascolto = (d) => {
      pezzi.push(new Float32Array(d)); n += d.length;
      if (MIC.livello > soglia) { parlato = true; silenzio = 0; } else if (parlato) silenzio += d.length;
      if ((parlato && silenzio > 0.5 * MIC.fs && n > 0.8 * MIC.fs) || n > maxSec * MIC.fs) {
        MIC.ascolto = null; res(concatena(pezzi));
      }
    };
  });
}
function riascolta(clip) {
  if (!MIC.ctx || !clip) return;
  const b = MIC.ctx.createBuffer(1, clip.length, MIC.fs); b.copyToChannel(clip, 0);
  const s = MIC.ctx.createBufferSource(); s.buffer = b; s.connect(MIC.ctx.destination); s.start();
}

// ------------------------------------------------------------------ schermate
let SCHERMATA = 'home';
function vai(s) { SCHERMATA = s; render(); window.scrollTo(0, 0); }
function render() {
  const f = { home: renderHome, mie: renderMie, storico: renderStorico, impostazioni: renderImpostazioni, aiuto: renderAiuto }[SCHERMATA];
  if (f) f();
}

function renderHome() {
  const t = taratura(), c = t.centroidiHz(), pronta = t.pronta();
  const nOggi = DATI.storico.filter((r) => r.data.slice(0, 10) === ora().slice(0, 10)).length;
  const voceLista = (k) => `<button class="voce" data-lista="${k}"><b>${esc(LISTE[k].titolo)}</b><span>${esc(LISTE[k].descrizione)} · ${LISTE[k].parole.length} voci</span></button>`;
  $('#app').innerHTML = `
    <h1>Dizione</h1>
    <p class="sotto">Misura l’apertura delle tue vocali e la durata delle doppie. Tutto resta sul telefono.</p>
    <div class="card ${pronta ? '' : 'avviso'}">
      ${pronta ? `<b>Taratura fatta</b> <span class="stato s-ok">pronta</span>
        <p class="nota">é ${c['é'][0]}/${c['é'][1]} Hz · è ${c['è'][0]}/${c['è'][1]} Hz · ó ${c['ó'][0]}/${c['ó'][1]} Hz · ò ${c['ò'][0]}/${c['ò'][1]} Hz</p>`
        : `<b>Prima fai la taratura</b><p class="nota">22 parole lette con cura, circa un minuto. Serve a ricavare le TUE vocali chiuse e aperte di riferimento con il microfono del telefono.</p>`}
      <button class="btn ${pronta ? 'sec' : ''}" data-lista="taratura">${pronta ? 'Aggiungi campioni alla taratura' : 'Inizia la taratura'}</button>
      ${t.avvisi().map((a) => `<p class="nota">⚠️ ${esc(a)}</p>`).join('')}
    </div>
    <h2>Test diagnostici</h2>
    ${voceLista('diagnostico_metafonia')}${voceLista('diagnostico_coppie')}
    <h2>Esercizi</h2>
    ${voceLista('esercizio_e')}${voceLista('esercizio_o')}${voceLista('doppie')}
    <button class="voce" id="vaiMie"><b>Parole mie</b><span>Scrivi tu le parole da allenare</span></button>
    <h2>Altro</h2>
    <div class="riga"><button class="btn sec" id="vaiStorico">Storico${nOggi ? ` (${nOggi} oggi)` : ''}</button><button class="btn sec" id="vaiImp">Impostazioni</button></div>
    <button class="btn sec" id="vaiAiuto">Come si usa</button>`;
  document.querySelectorAll('[data-lista]').forEach((b) => b.onclick = () => iniziaLista(b.dataset.lista));
  $('#vaiMie').onclick = () => vai('mie'); $('#vaiStorico').onclick = () => vai('storico');
  $('#vaiImp').onclick = () => vai('impostazioni'); $('#vaiAiuto').onclick = () => vai('aiuto');
}

function renderMie() {
  $('#app').innerHTML = `
    <button class="indietro" id="ind">‹ Indietro</button>
    <h1>Parole mie</h1>
    <p class="sotto">Una voce per riga. Segna con l’accento la vocale da misurare: <b>é è ó ò</b> (es. <i>stélla</i>, <i>pòrta</i>). In una frase accenta solo la parola da misurare (<i>vado a pésca</i>).</p>
    <textarea id="mie" placeholder="nóme&#10;pòsto&#10;vado a pésca">${esc(DATI.mie || '')}</textarea>
    <label class="nota"><input type="checkbox" id="mieAcc" checked> Mostra gli accenti mentre leggo</label>
    <button class="btn" id="via">Inizia</button>`;
  $('#ind').onclick = () => vai('home');
  $('#via').onclick = () => {
    DATI.mie = $('#mie').value; salva();
    const parole = DATI.mie.split(/\n|,/).map((s) => s.trim()).filter(Boolean);
    if (!parole.length) return mostraAvviso('Scrivi almeno una parola.');
    const frasi = parole.some((p) => p.includes(' '));
    avviaSessione({ nome: 'mie', titolo: 'Parole mie', analisi: 'vocali', accenti: $('#mieAcc').checked, secondi: frasi ? 3 : 2, ripeti: true, parole });
  };
}

function iniziaLista(k) {
  const L = LISTE[k];
  if (k !== 'taratura' && L.analisi === 'vocali' && !taratura().pronta()) {
    mostraAvviso('Prima fai la taratura: senza, posso darti solo i valori grezzi.');
  }
  avviaSessione({ nome: k, ...L, ripeti: L.ripeti && DATI.impostazioni.ripeti,
    aggiungi: k === 'taratura' && Object.keys(DATI.taratura || {}).length > 0 });
}

// ------------------------------------------------------------------ sessione
let S = null;
function renderSessione() {
  const cfg = S.cfg, voce = cfg.parole[S.i] || '';
  $('#app').innerHTML = `
    <div class="sess">
      <div class="sess-top"><span>${esc(cfg.titolo)}</span><span>${Math.min(S.i + 1, cfg.parole.length)} / ${cfg.parole.length}</span></div>
      <div class="parola ${voce.includes(' ') ? 'frase' : ''}" id="parola">${S.fase === 'pronto' ? 'Preparati…' : parolaHtml(voce, cfg.accenti)}</div>
      <div class="fase" id="fase"></div>
      <div class="meter"><div id="meter"></div></div>
      <div class="esito" id="esito"></div>
      <div class="comandi">
        <div class="riga">
          <button class="btn sec" id="bRipeti">Ripeti</button>
          <button class="btn sec" id="bAscolta">Riascolta</button>
        </div>
        <div class="riga">
          <button class="btn sec" id="bPausa">${S.pausa ? 'Riprendi ▶' : 'Pausa ❚❚'}</button>
          <button class="btn" id="bAvanti">Avanti ›</button>
        </div>
        <button class="btn peric" id="bFine">Termina</button>
      </div>
    </div>`;
  $('#bRipeti').onclick = () => azione('ripeti');
  $('#bAscolta').onclick = () => { S.pausa = true; $('#bPausa').textContent = 'Riprendi ▶'; riascolta(S.ultimaClip); };
  $('#bPausa').onclick = () => { S.pausa = !S.pausa; $('#bPausa').textContent = S.pausa ? 'Riprendi ▶' : 'Pausa ❚❚'; if (!S.pausa && risolviAzione) azione('avanti'); };
  $('#bAvanti').onclick = () => azione('avanti');
  $('#bFine').onclick = () => { S.stop = true; azione('fine'); };
  aggiornaFase();
}
function aggiornaFase() {
  const f = $('#fase'); if (!f) return;
  const testi = { pronto: 'Silenzio per un attimo…', parla: '● Parla ora', analisi: 'Analizzo…', esito: '' };
  f.textContent = testi[S.fase] || ''; f.className = 'fase' + (S.fase === 'parla' ? ' rec' : '');
}
let risolviAzione = null;
function azione(a) { if (risolviAzione) { const r = risolviAzione; risolviAzione = null; r(a); } else if (S) S.azioneInSospeso = a; }
function attendi(ms) {
  return new Promise((res) => {
    if (S.azioneInSospeso) { const a = S.azioneInSospeso; S.azioneInSospeso = null; return res(a); }
    risolviAzione = res;
    const scatto = () => {
      if (risolviAzione !== res) return;
      if (S && S.pausa) { setTimeout(scatto, 300); return; }   // in pausa si aspetta un comando
      risolviAzione = null; res('tempo');
    };
    setTimeout(scatto, ms);
  });
}

function descriviEsito(m, cfg) {
  if (!m.f1) return `<div class="grande">Non ho sentito bene</div><p class="nota">${esc(m.note.join('; ') || 'Riprova più vicino al telefono, a voce piena.')}</p>`;
  if (cfg.analisi === 'taratura') return `<div class="grande">Registrata ✓</div><p class="nota">F1 ${m.f1} Hz · F2 ${m.f2} Hz</p>`;
  if (cfg.analisi === 'durate') return `<div class="grande">${m.consonanteMs ? `consonante ${m.consonanteMs} ms` : '—'}</div><p class="nota">vocale tonica ${m.vocaleMs} ms</p>`;
  if (m.apertura == null) {
    return m.attesa && m.esito ? `<div class="grande">${m.esito === 'ok' ? '✓' : '?'} ${esc(m.attesa)}</div><p class="nota">più vicina a: ${esc(m.piuVicina)}</p>`
      : `<p class="nota">F1 ${m.f1} Hz · F2 ${m.f2} Hz${taratura().pronta() ? '' : ' — fai la taratura per avere il giudizio'}</p>`;
  }
  const voluta = (m.attesa === 'é' || m.attesa === 'ó') ? 'chiusa' : 'aperta';
  const cls = m.esito === 'ok' ? 's-ok' : m.esito === '~' ? 's-mezzo' : 's-no';
  const titolo = m.esito === 'ok' ? `Giusta: ${m.attesa} ${voluta}` : m.esito === '~'
    ? `Quasi: ${voluta === 'chiusa' ? 'chiudi' : 'apri'} un po’ di più` : `${m.giudizio === 'aperta' ? 'Aperta' : 'Chiusa'}: doveva essere ${voluta} (${m.attesa})`;
  const pos = Math.max(-0.25, Math.min(1.25, m.apertura));
  const x = (pos + 0.25) / 1.5 * 100;
  return `<div class="grande"><span class="stato ${cls}" style="font-size:20px;padding:6px 14px">${esc(titolo)}</span></div>
    <div class="barra"><div class="seg" style="left:${(0.6 / 1.5) * 100}%"></div><div class="seg" style="left:${(0.9 / 1.5) * 100}%"></div><div class="punto" style="left:${x}%"></div></div>
    <div class="etich"><span>chiusa</span><span>apertura ${m.apertura}</span><span>aperta</span></div>`;
}

async function avviaSessione(cfg) {
  S = { cfg, i: 0, fase: 'pronto', pausa: false, stop: false, risultati: [], finali: new Array(cfg.parole.length).fill(null), tentativi: 0,
    sessione: `tel_${ora().replace(/[-:T]/g, '').slice(0, 14)}_${cfg.nome}`, ultimaClip: null };
  renderSessione();
  try { await apriMicrofono(); }
  catch (e) {
    S = null;
    $('#app').innerHTML = `<button class="indietro" id="ind">‹ Indietro</button><div class="card errore"><b>Microfono non disponibile</b>
      <p>${esc(e.message || e.name)}</p><p class="nota">Su iPhone: Impostazioni › Safari › Microfono › Consenti (oppure tocca “aA” nella barra di Safari › Impostazioni sito web › Microfono). Poi riapri la pagina.</p></div>`;
    $('#ind').onclick = () => vai('home');
    return;
  }
  await misuraRumore(0.7);
  const tar = taratura(), prof = profiloVoce();
  while (S && !S.stop && S.i < cfg.parole.length) {
    const voce = cfg.parole[S.i];
    S.fase = 'parla'; renderSessione();
    const clip = await registraParola(cfg.secondi + 0.6);
    if (!S || S.stop) break;
    S.ultimaClip = clip; S.fase = 'analisi'; aggiornaFase();
    await sleep(20);
    const m = D.misuraClip(clip, MIC.fs, voce, prof);
    if (cfg.analisi !== 'taratura') tar.classifica(m);
    S.risultati.push(m); S.finali[S.i] = m;
    if (cfg.analisi !== 'taratura' && m.f1) registraStorico(m, cfg);
    S.fase = 'esito'; aggiornaFase();
    $('#esito').innerHTML = descriviEsito(m, cfg);
    const sbagliata = m.esito === 'ERRORE' || m.esito === '~' || !m.f1;
    const a = await attendi(sbagliata ? 2200 : 1300);
    if (a === 'fine') break;
    if (a === 'ripeti' || (a === 'tempo' && cfg.ripeti && sbagliata && S.tentativi < 2)) { S.tentativi++; continue; }
    S.i++; S.tentativi = 0;
  }
  const fatta = S; chiudiMicrofono(); S = null;
  if (fatta) concludi(fatta);
}

function registraStorico(m, cfg) {
  DATI.storico.push({ data: ora(), sessione: S.sessione, parola: m.parola, attesa: m.attesa || '', f1: m.f1, f2: m.f2,
    piu_vicina: m.piuVicina || '', apertura: m.apertura ?? '', giudizio: m.giudizio || '', esito: m.esito || '',
    vocale_ms: m.vocaleMs ?? '', consonante_ms: m.consonanteMs ?? '', note: m.note.join(' | '), dispositivo: 'telefono' });
  if (DATI.storico.length > 20000) DATI.storico.splice(0, DATI.storico.length - 20000);
  salva();
}

function concludi(s) {
  const cfg = s.cfg;
  if (cfg.analisi === 'taratura') return concludiTaratura(s);
  const fin = s.finali.filter(Boolean);
  const conta = {}; fin.forEach((m) => { if (m.esito) conta[m.esito] = (conta[m.esito] || 0) + 1; });
  const righe = fin.map((m) => {
    const cls = m.esito === 'ok' ? 's-ok' : m.esito === '~' ? 's-mezzo' : m.esito ? 's-no' : '';
    const val = cfg.analisi === 'durate' ? `V ${m.vocaleMs ?? '–'} · C ${m.consonanteMs ?? '–'} ms` : (m.apertura != null ? `apertura ${m.apertura}` : (m.f1 ? `${m.f1}/${m.f2}` : 'non rilevata'));
    return `<tr><td>${parolaHtml(m.parola, true)}</td><td class="nota">${val}</td><td>${m.esito ? `<span class="stato ${cls}">${esc(m.esito)}</span>` : ''}</td></tr>`;
  }).join('');
  const doppie = cfg.analisi === 'durate' ? D.confrontaDoppie(fin) : [];
  const errori = fin.filter((m) => m.esito === 'ERRORE' || m.esito === '~').map((m) => m.parola);
  $('#app').innerHTML = `
    <h1>Fatto</h1>
    <p class="sotto">${esc(cfg.titolo)} · ${fin.length} voci${Object.keys(conta).length ? ' · ' + Object.entries(conta).map(([k, v]) => `${k} ${v}`).join(', ') : ''}</p>
    ${doppie.length ? `<div class="card"><b>Doppie e scempie</b><table>${doppie.map((c) => `<tr><td>${esc(c.coppia)}</td><td class="nota">${c.scempia} → ${c.doppia} ms (×${c.rapporto})</td><td><span class="stato ${c.giudizio === 'distinta' ? 's-ok' : c.giudizio === 'debole' ? 's-mezzo' : 's-no'}">${esc(c.giudizio)}</span></td></tr>`).join('')}</table>
      <p class="nota">Una doppia è “distinta” se la consonante dura almeno 1,6 volte la scempia.</p></div>` : ''}
    <div class="card"><table><tr><th>Voce</th><th>Misura</th><th>Esito</th></tr>${righe}</table></div>
    ${errori.length ? `<button class="btn" id="rifai">Riallena le ${errori.length} sbagliate</button>` : ''}
    <button class="btn sec" id="home">Torna all’inizio</button>`;
  if (errori.length) $('#rifai').onclick = () => avviaSessione({ ...cfg, nome: cfg.nome + '_errori', titolo: cfg.titolo + ' — errori', accenti: true, ripeti: true, parole: errori });
  $('#home').onclick = () => vai('home');
}

function concludiTaratura(s) {
  const nuova = !s.cfg.aggiungi;
  const tar = nuova ? new D.Taratura({}) : taratura();
  let usate = 0; const scartate = [];
  for (const m of s.finali) {
    if (!m) continue;
    const dubbia = m.note.some((n) => /non rilevata|incerta|nessuna/.test(n));
    if (m.f1 && m.f2 && m.attesa && !dubbia) { tar.aggiungi(m.attesa, m.f1, m.f2); usate++; } else scartate.push(m.parola);
  }
  DATI.taratura = tar.campioni; salva();
  const c = tar.centroidiHz();
  $('#app').innerHTML = `
    <h1>Taratura salvata</h1>
    <p class="sotto">Campioni usati ${usate}${scartate.length ? ` · scartati: ${esc(scartate.join(', '))}` : ''}</p>
    <div class="card"><table><tr><th>Vocale</th><th>F1 Hz</th><th>F2 Hz</th><th>campioni</th></tr>
      ${D.CATEGORIE.filter((k) => c[k]).map((k) => `<tr><td><b>${k}</b></td><td>${c[k][0]}</td><td>${c[k][1]}</td><td>${c[k][2]}</td></tr>`).join('')}</table></div>
    ${tar.avvisi().map((a) => `<div class="card avviso">${esc(a)}</div>`).join('')}
    <p class="nota">Conviene fare la taratura due volte (la seconda con “Aggiungi campioni”): con più campioni i giudizi sono più stabili.</p>
    <button class="btn" id="home">Fatto</button>`;
  $('#home').onclick = () => vai('home');
}

// ------------------------------------------------------------------ storico
function csvStorico() {
  const campi = ['data','sessione','parola','attesa','f1','f2','piu_vicina','apertura','giudizio','esito','vocale_ms','consonante_ms','note','dispositivo'];
  const q = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [campi.join(';')].concat(DATI.storico.map((r) => campi.map((c) => q(r[c])).join(';'))).join('\n');
}
async function condividiFile(nome, testo, tipo) {
  const file = new File([testo], nome, { type: tipo });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: nome }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
}
function renderStorico() {
  const giorni = 30, limite = new Date(Date.now() - giorni * 864e5).toISOString().slice(0, 19);
  const righe = DATI.storico.filter((r) => r.data >= limite && r.esito);
  const perCat = {}, perParola = {};
  for (const r of righe) {
    (perCat[r.attesa] = perCat[r.attesa] || []).push(r);
    (perParola[r.parola] = perParola[r.parola] || []).push(r.esito);
  }
  const tab = D.CATEGORIE.filter((c) => perCat[c]).map((c) => {
    const v = perCat[c], ok = v.filter((r) => r.esito === 'ok').length, ap = v.filter((r) => r.apertura !== '');
    return `<tr><td><b>${c}</b></td><td>${v.length}</td><td>${Math.round(100 * ok / v.length)}%</td><td>${ap.length ? (ap.reduce((a, r) => a + Number(r.apertura), 0) / ap.length).toFixed(2) : '–'}</td></tr>`;
  }).join('');
  const peggiori = Object.entries(perParola).map(([p, v]) => [p, v.filter((e) => e === 'ERRORE').length / v.length, v.length])
    .filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1] || b[2] - a[2]).slice(0, 10);
  const giorniAttivi = new Set(DATI.storico.map((r) => r.data.slice(0, 10))).size;
  $('#app').innerHTML = `
    <button class="indietro" id="ind">‹ Indietro</button>
    <h1>Storico</h1>
    <p class="sotto">${DATI.storico.length} misure in ${giorniAttivi} giorni · ultimi ${giorni} giorni qui sotto</p>
    <div class="card">${tab ? `<table><tr><th>Vocale</th><th>Misure</th><th>Giuste</th><th>Apertura media</th></tr>${tab}</table>
      <p class="nota">Apertura: 0 = la tua vocale chiusa di riferimento, 1 = la tua aperta.</p>` : '<p class="nota">Ancora nessuna misura con giudizio.</p>'}</div>
    ${peggiori.length ? `<div class="card"><b>Da allenare</b><table>${peggiori.map(([p, q, n]) => `<tr><td>${parolaHtml(p, true)}</td><td class="nota">${Math.round(q * 100)}% sbagliate su ${n}</td></tr>`).join('')}</table>
      <button class="btn" id="allena">Allena queste parole</button></div>` : ''}
    <h2>Per il PC e per Claude</h2>
    <p class="nota">Esporta il CSV e salvalo su Google Drive: sul PC Claude lo aggiunge allo storico con lo strumento <i>importa_storico</i>.</p>
    <button class="btn" id="csv">Esporta storico (CSV)</button>
    <div class="riga"><button class="btn sec" id="backup">Backup completo</button><button class="btn sec" id="ripr">Ripristina backup</button></div>
    <input type="file" id="fileRipr" accept=".json,application/json" hidden>
    <button class="btn peric" id="canc">Cancella lo storico</button>`;
  $('#ind').onclick = () => vai('home');
  if (peggiori.length) $('#allena').onclick = () => avviaSessione({ nome: 'da_allenare', titolo: 'Da allenare', analisi: 'vocali', accenti: true, secondi: 2.4, ripeti: true, parole: peggiori.map((x) => x[0]) });
  $('#csv').onclick = () => condividiFile(`dizione_telefono_${ora().slice(0, 10)}.csv`, '﻿' + csvStorico(), 'text/csv');
  $('#backup').onclick = () => condividiFile(`dizione_backup_${ora().slice(0, 10)}.json`, JSON.stringify(DATI), 'application/json');
  $('#ripr').onclick = () => $('#fileRipr').click();
  $('#fileRipr').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.storico || !d.impostazioni) throw new Error();
      DATI = d; salva(); mostraAvviso('Backup ripristinato.'); vai('home'); }
    catch (err) { mostraAvviso('File di backup non valido.'); }
  };
  $('#canc').onclick = () => {
    const b = $('#canc');
    if (b.dataset.conferma) { DATI.storico = []; salva(); vai('storico'); mostraAvviso('Storico cancellato (la taratura resta).'); }
    else { b.dataset.conferma = '1'; b.textContent = 'Tocca di nuovo per confermare'; }
  };
}

// ------------------------------------------------------------------ impostazioni
function renderImpostazioni() {
  const imp = DATI.impostazioni;
  $('#app').innerHTML = `
    <button class="indietro" id="ind">‹ Indietro</button>
    <h1>Impostazioni</h1>
    <div class="card"><b>Voce</b>
      <select id="voce"><option value="uomo">Uomo (formanti fino a 5000 Hz)</option><option value="donna">Donna (fino a 5500 Hz)</option></select></div>
    <div class="card"><label><input type="checkbox" id="ripeti" ${imp.ripeti ? 'checked' : ''}> Negli esercizi ripeti fino a 2 volte le parole sbagliate</label></div>
    <div class="card"><b>Prova del microfono</b>
      <p class="nota">Parla normalmente a 20–30 cm: la barra deve muoversi bene senza arrivare sempre in fondo.</p>
      <div class="meter" style="margin:12px 0"><div id="meter"></div></div>
      <p class="nota" id="micInfo"></p>
      <button class="btn sec" id="prova">Avvia la prova</button></div>
    <div class="card"><b>Taratura</b><p class="nota">Rifalla da zero se cambi telefono o se usi un microfono esterno.</p>
      <button class="btn peric" id="rifai">Rifai la taratura da zero</button></div>`;
  $('#voce').value = imp.voce;
  $('#voce').onchange = (e) => { imp.voce = e.target.value; salva(); };
  $('#ripeti').onchange = (e) => { imp.ripeti = e.target.checked; salva(); };
  $('#ind').onclick = () => { chiudiMicrofono(); vai('home'); };
  $('#prova').onclick = async () => {
    try { await apriMicrofono(); } catch (e) { $('#micInfo').textContent = 'Microfono non disponibile: ' + (e.message || e.name); return; }
    $('#micInfo').textContent = 'Parla per 4 secondi…';
    const pezzi = []; MIC.ascolto = (d) => pezzi.push(new Float32Array(d));
    await sleep(4000); MIC.ascolto = null;
    const lv = D.livelli(concatena(pezzi));
    $('#micInfo').textContent = `Picco ${lv.piccoDbfs.toFixed(1)} dBFS · frequenza ${MIC.fs} Hz` +
      (lv.clipping > 0.05 ? ' — troppo forte, allontanati' : lv.piccoDbfs < -30 ? ' — debole, avvicinati' : ' — ok');
  };
  $('#rifai').onclick = () => avviaSessione({ nome: 'taratura', ...LISTE.taratura, aggiungi: false });
}

function renderAiuto() {
  $('#app').innerHTML = `
    <button class="indietro" id="ind">‹ Indietro</button>
    <h1>Come si usa</h1>
    <div class="card"><b>1. Taratura</b><p>Leggi con cura le 22 parole che compaiono. Sono parole in cui la pronuncia standard e l’abitudine sarda coincidono: servono a ricavare la TUA é, è, ó, ò di riferimento. Falla due volte.</p></div>
    <div class="card"><b>2. Test e esercizi</b><p>Compare una parola: leggila a voce normale, a 20–30 cm dal telefono, in un ambiente silenzioso. La registrazione si ferma da sola quando smetti di parlare.</p>
      <p>Il pallino sulla barra mostra quanto è aperta la vocale: a sinistra la tua chiusa, a destra la tua aperta.</p></div>
    <div class="card"><b>Accenti</b><p><span class="v-chiusa"><b>é ó</b></span> in blu: vocale chiusa. <span class="v-aperta"><b>è ò</b></span> in arancio: vocale aperta. Nei test diagnostici gli accenti sono nascosti, per misurare la tua pronuncia spontanea.</p></div>
    <div class="card"><b>Limiti</b><p class="nota">Le misure sono acustiche (formanti), non un orecchio umano. Funzionano bene su parole isolate e frasi brevi lette con calma; con rumore di fondo diventano meno affidabili.</p></div>
    <div class="card"><b>Installazione come app</b><p class="nota">In Safari: tasto Condividi › “Aggiungi alla schermata Home”. I dati restano solo su questo telefono: ogni tanto fai un backup dallo Storico.</p></div>`;
  $('#ind').onclick = () => vai('home');
}

window.addEventListener('pagehide', chiudiMicrofono);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
